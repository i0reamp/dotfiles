# =============================================================================
#                    tmux config — pragmatic & pretty
# =============================================================================
#   prefix: Ctrl-Space  (no shell conflict, single chord)
#   vim navigation, fish inside, wayland clipboard, popup launcher
#   plugins via TPM — install with: prefix + I
# =============================================================================

# ─── core ────────────────────────────────────────────────────────────────────
set -g  default-terminal     "tmux-256color"
set -ag terminal-overrides   ",*256col*:RGB,foot:RGB,xterm-256color:RGB"
set -g  default-shell        /usr/bin/fish

set -g  history-limit        100000
set -g  mouse                on
set -g  focus-events         on
set -g  set-clipboard        on
set -sg escape-time          10
set -g  base-index           1
setw -g pane-base-index      1
set -g  renumber-windows     on
set -g  display-time         2000
set -g  status-interval      5
set -g  detach-on-destroy    off

# ─── prefix ──────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind   C-Space send-prefix

# ─── splits & windows ────────────────────────────────────────────────────────
bind |  split-window -h  -c "#{pane_current_path}"
bind \\ split-window -h  -c "#{pane_current_path}"
bind -  split-window -v  -c "#{pane_current_path}"
bind _  split-window -v  -c "#{pane_current_path}"
bind c  new-window         -c "#{pane_current_path}"

# fast window jumps without prefix
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# alt-h/l: window prev/next without prefix
bind -n M-h previous-window
bind -n M-l next-window

# ─── pane navigation (vim-style) ─────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

bind  o resize-pane -Z          # toggle pane zoom
bind  x kill-pane               # kill without confirmation prompt
bind  q kill-session            # kill current session

# ─── copy mode (vim) ─────────────────────────────────────────────────────────
setw -g mode-keys vi
bind  Enter copy-mode
bind  -T copy-mode-vi v      send -X begin-selection
bind  -T copy-mode-vi V      send -X select-line
bind  -T copy-mode-vi C-v    send -X rectangle-toggle
bind  -T copy-mode-vi y      send -X copy-pipe-and-cancel "wl-copy"
bind  -T copy-mode-vi Y      send -X copy-pipe-end-of-line-and-cancel "wl-copy"
bind  -T copy-mode-vi Escape send -X cancel
bind  -T copy-mode-vi /      send -X search-forward
bind  -T copy-mode-vi ?      send -X search-backward
# stay in copy-mode after mouse selection
unbind -T copy-mode-vi MouseDragEnd1Pane
bind  -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "wl-copy"

# paste from system clipboard
bind p run "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"

# ─── sessions ────────────────────────────────────────────────────────────────
bind C-Space switch-client -l   # prefix prefix → last session
bind Tab     last-window
bind Space   switch-client -l
bind s       choose-tree -Zs    # session picker
bind w       choose-tree -Zw    # window picker
bind R       command-prompt -p "rename session:" "rename-session '%%'"

# ─── popups (the real power move) ────────────────────────────────────────────
# Floating shell — quick scratch terminal
bind -n M-Space display-popup -E -w 80% -h 75% -d "#{pane_current_path}" "fish"

# fzf-driven session switcher
bind C-s display-popup -E -w 60% -h 50% \
  "tmux list-sessions -F '#S' | \
   fzf --reverse --header='switch session' | \
   xargs -r tmux switch-client -t"

# fzf-driven dir jump (zoxide → new pane)
bind C-d display-popup -E -w 60% -h 50% \
  "fish -c 'zoxide query -l | fzf --reverse --header=\"jump to dir\" | read -l d; and tmux split-window -h -c \$d'"

# lazygit popup
bind g display-popup -E -w 95% -h 95% -d "#{pane_current_path}" "lazygit"

# ─── reload ──────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "↻ tmux.conf reloaded"

# =============================================================================
#                              theme — minimal
#       palette: catppuccin-mocha-ish, dark, pills like waybar
# =============================================================================
%hidden BG="#1e1e2e"
%hidden FG="#cdd6f4"
%hidden DIM="#6c7086"
%hidden MUTE="#313244"
%hidden ACCENT="#89b4fa"
%hidden SUCCESS="#a6e3a1"
%hidden WARN="#f9e2af"
%hidden ALERT="#f38ba8"

# ── status bar ──
set -g  status-position bottom
set -g  status-justify  left
set -g  status-style    "bg=$BG,fg=$FG"
set -g  status-left-length  40
set -g  status-right-length 100

set -g  status-left "#[bg=$ACCENT,fg=$BG,bold]  #S #[bg=$BG,fg=$ACCENT]  "
set -g  status-right "#[fg=$DIM]#(whoami)@#h #[bg=$MUTE,fg=$FG]  %a %d.%m #[bg=$ACCENT,fg=$BG,bold]  %H:%M "

# ── windows ──
set -g  window-status-format "#[fg=$DIM] #I·#W#{?window_zoomed_flag, ,} "
set -g  window-status-current-format "#[bg=$MUTE,fg=$ACCENT,bold] #I·#W#{?window_zoomed_flag, ,} "
set -g  window-status-separator ""
set -g  window-status-activity-style "fg=$WARN"
set -g  window-status-bell-style "fg=$ALERT"

# ── panes ──
set -g  pane-border-style        "fg=$MUTE"
set -g  pane-active-border-style "fg=$ACCENT"
set -g  pane-border-lines        single

# ── messages ──
set -g  message-style          "bg=$ACCENT,fg=$BG,bold"
set -g  message-command-style  "bg=$MUTE,fg=$FG"

# ── copy-mode marks ──
set -g  mode-style "bg=$ACCENT,fg=$BG"

# =============================================================================
#                                  plugins
#  install TPM:  git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#  inside tmux:  prefix + I  (capital i) — installs the listed plugins
#  update:       prefix + U
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'

# ── resurrect / continuum ──
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim         'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# ── yank — copies to wayland clipboard automatically ──
set -g @yank_selection_mouse 'clipboard'
set -g @yank_action          'copy-pipe-no-clear'

# ── tmux-fzf trigger override (default xf collides; use F) ──
TMUX_FZF_LAUNCH_KEY="F"

# ── boot TPM (keep at the very end!) ──
if 'test ! -d ~/.tmux/plugins/tpm' \
   'run "git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins"'
run '~/.tmux/plugins/tpm/tpm'
