# =============================================================================
# tmux config — dark theme, vim navigation
# =============================================================================

# --- General ----------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -ag terminal-features ",alacritty:RGB"
set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -sg escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Prefix -----------------------------------------------------------------

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Splits -----------------------------------------------------------------

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Vim navigation ---------------------------------------------------------

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copy mode (vim) --------------------------------------------------------

setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel

# --- Reload -----------------------------------------------------------------

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# --- Quick switch ------------------------------------------------------------

bind -r Tab last-window
bind Space switch-client -l

# =============================================================================
# Theme — matches waybar dark pills
# =============================================================================

# --- Colors -----------------------------------------------------------------

BG="#222222"
FG="#ffffff"
DIM="#888888"
MODULE="#333333"
ACCENT="#88c0d0"
FOCUSED="#285577"
GREEN="#32cd32"
ORANGE="#e89048"

# --- Status bar -------------------------------------------------------------

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=$BG,fg=$FG"

# Left: session name
set -g status-left-length 20
set -g status-left "#[bg=$FOCUSED,fg=$FG,bold] #S #[default] "

# Right: host, date, time
set -g status-right-length 50
set -g status-right "#[fg=$DIM]#H #[default]#[bg=$MODULE,fg=$FG] %d.%m #[bg=$FOCUSED,fg=$ACCENT,bold] %H:%M #[default]"

# --- Windows ----------------------------------------------------------------

set -g window-status-format "#[bg=$MODULE,fg=$DIM] #I #W #[default]"
set -g window-status-current-format "#[bg=$FOCUSED,fg=$FG,bold] #I #W #[default]"
set -g window-status-separator " "

# --- Panes ------------------------------------------------------------------

set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=$ACCENT"

# --- Messages ---------------------------------------------------------------

set -g message-style "bg=$MODULE,fg=$FG"
set -g message-command-style "bg=$MODULE,fg=$ACCENT"

# --- Mode (copy, etc) ------------------------------------------------------

setw -g mode-style "bg=$FOCUSED,fg=$FG"
